# Notch default settings, shipped with the plugin -- do not edit this file,
# your changes will be lost on update. Copy it to
# ~/.config/notch/settings.toml and edit the copy instead. Edits there apply
# live -- no restart needed.

# Open pill size: small | medium | large (only affects the open/hovered
# state -- the collapsed idle strip stays a fixed size regardless)
size = "small"

# Which rings show, and in what order (top to bottom = declared order here).
# true = show, false = hide. Any other agent id omarchy.agents writes a
# usage record for also works -- just add a line with that id.
[items]
claude = false
codex = false
fireworks = false
cpu = true
memory = true
weather = true
download = false
upload = false
