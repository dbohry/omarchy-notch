# Notch default settings, shipped with the plugin -- do not edit this file,
# your changes will be lost on update.
#
# Normal way to change settings: hover the pill, click the gear icon,
# toggle/reorder items, pick a size. Applies live, no restart.
#
# To hand-edit instead: copy this file to ~/.config/notch/settings.toml,
# edit the copy, then run `omarchy restart shell` to pick it up.

# Open pill size: small | medium | large (only affects the open/hovered
# state -- the collapsed idle strip stays a fixed size regardless)
size = "small"

# Which rings show, and in what order (top to bottom = declared order here).
# true = show, false = hide. Any other agent id omarchy.agents writes a
# usage record for also works -- just add a line with that id.
[items]
claude = false
codex = false
fireworks = false
cpu = true
memory = true
weather = true
download = false
upload = false
